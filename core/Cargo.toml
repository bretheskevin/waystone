[package]
name = "waystone-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
argon2 = { version = "0.5", features = ["alloc"] }
chacha20poly1305 = "0.10"
rand = "0.9"
hex = "0.4"
thiserror = "2"
zeroize = "1"
zip = { version = "2", features = ["deflate"], default-features = false }

[dev-dependencies]
serde_json = "1"
