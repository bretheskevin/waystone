# deploy/docker-compose.yml
services:
  webdav:
    build: .
    container_name: waystone-webdav
    restart: unless-stopped
    # Auth is controlled by deploy/entrypoint.sh — see deploy/README.md.
    environment:
      - "WAYSTONE_AUTH=${WAYSTONE_AUTH:-}"
    volumes:
      - waystone-data:/data
    ports:
      - "${WAYSTONE_PORT:-5005}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://localhost:5000/ 2>&1 | grep -qE ' (200|401) '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Traefik reverse proxy (Dokploy)
      - "traefik.enable=true"
      - "traefik.http.routers.waystone.rule=Host(`${WAYSTONE_DOMAIN:-waystone.localhost}`)"
      - "traefik.http.routers.waystone.entrypoints=websecure"
      - "traefik.http.routers.waystone.tls.certresolver=letsencrypt"
      - "traefik.http.services.waystone.loadbalancer.server.port=5000"

volumes:
  waystone-data:
