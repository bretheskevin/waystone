name: Release

# Build the 3DS shell (.3dsx + installable .cia), the Switch shell (.nro), the Android shell
# (waystone.apk) and the desktop binaries (waystone-desktop-<target triple>[.exe]) from one vX.Y.Z
# tag and publish them as one GitHub Release. Each in-app updater picks its asset by suffix
# (.3dsx / .cia / .nro / .apk) or exact name (desktop), so asset names must not change.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check VERSION matches the tag
        shell: bash
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V ref=$GITHUB_REF_NAME type=$GITHUB_REF_TYPE"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION '$V' is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != v$V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build-3ds:
    needs: version
    runs-on: ubuntu-latest
    # Build inside the devkitARM container: it ships devkitARM/libctru/3ds-curl
    # preinstalled (same base as 3ds/Dockerfile, minus the corp-CA injection,
    # which is gitignored and absent in CI).
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + rust-src
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal
            rm /tmp/rustup.sh
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rust-src
          rustup --version && rustc --version

      - name: Install CIA packaging tools (makerom + bannertool)
        shell: bash
        run: |
          set -euxo pipefail
          # makerom v0.18.4 (3DSGuy/Project_CTR) — v0.19.0 needs GLIBC_2.38, image has 2.36
          # bannertool v1.2.2 (Epicpkmn11/bannertool — Steveice10's repo is archived/404)
          # Identical pins to 3ds/Dockerfile; sha256 pinned because release assets are mutable.
          apt-get update -y
          apt-get install -y --no-install-recommends unzip
          curl -fsSL "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip" -o /tmp/makerom.zip
          echo "dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  /tmp/makerom.zip" | sha256sum -c -
          mkdir -p /tmp/mr; unzip -o /tmp/makerom.zip -d /tmp/mr
          install -m755 "$(find /tmp/mr -name makerom -type f | head -1)" /usr/local/bin/makerom
          rm -rf /tmp/makerom.zip /tmp/mr
          curl -fsSL "https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip" -o /tmp/bannertool.zip
          echo "e4259c08fe8944ebadd5f4b96f9a8603e5427338074cfc46323fbbc3410d51ed  /tmp/bannertool.zip" | sha256sum -c -
          mkdir -p /tmp/bt; unzip -o /tmp/bannertool.zip linux-x86_64/bannertool -d /tmp/bt
          install -m755 /tmp/bt/linux-x86_64/bannertool /usr/local/bin/bannertool
          rm -rf /tmp/bannertool.zip /tmp/bt

      - name: Build 3DS shell
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +nightly build -Zbuild-std=core,alloc --target armv6k-nintendo-3ds --features 3ds -p waystone-ffi --release
          make -C 3ds clean
          make -C 3ds
          test -f 3ds/waystone-3ds-spike.3dsx
          make -C 3ds cia
          test -f 3ds/waystone-3ds-spike.cia

      - name: Upload 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waystone-3ds
          path: |
            3ds/waystone-3ds-spike.3dsx
            3ds/waystone-3ds-spike.cia
          if-no-files-found: error

  build-switch:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      # git must exist BEFORE checkout so the workspace is a real repo: the Makefile's
      # borealis-patch target runs `git -C lib/borealis apply`.
      - name: Install git
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v git >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y --no-install-recommends git ca-certificates
          fi

      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust nightly + rust-src
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal
            rm /tmp/rustup.sh
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rust-src
          rustup --version && rustc --version

      - name: Build Switch shell
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +nightly build -Zbuild-std=core,alloc --target aarch64-nintendo-switch-freestanding --features switch -p waystone-ffi --release
          make -C switch clean
          make -C switch
          test -f switch/waystone.nro

      - name: Relocation guard (libnx NRO loader accepts only RELATIVE/NONE)
        shell: bash
        run: |
          set -euo pipefail
          READELF=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf
          ELF=switch/waystone.elf
          # RELATIVE relocs live in .relr.dyn (DT_RELR) and are invisible to `readelf -r`, so a
          # grep for allowed types alone is vacuous: also require an empty RELA/PLT table.
          DYN=$("$READELF" -d "$ELF")
          echo "$DYN" | grep -E 'RELA|RELR|JMPREL|PLTREL' || true
          FAIL=0
          RELASZ=$(echo "$DYN" | sed -n 's/.*(RELASZ)[^0-9]*\([0-9]*\).*/\1/p' | head -1)
          RELASZ=${RELASZ:-0}
          if [ "$RELASZ" != "0" ]; then
            echo "::error::non-empty DT_RELA table in waystone.elf (RELASZ=$RELASZ)"; FAIL=1
          fi
          if echo "$DYN" | grep -qE '\((PLTRELSZ|JMPREL)\)'; then
            echo "::error::PLT relocations (PLTRELSZ/JMPREL) in waystone.elf: libnx does not apply them"; FAIL=1
          fi
          TYPES=$("$READELF" -r "$ELF" | grep -oE 'R_AARCH64_[A-Z0-9_]+' | sort | uniq -c || true)
          echo "$TYPES"
          BAD=$(echo "$TYPES" | grep -E 'R_AARCH64_' | grep -vE 'R_AARCH64_(RELATIVE|NONE)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::forbidden relocation types in waystone.elf (crash at boot):"
            echo "$BAD"; FAIL=1
          fi
          [ "$FAIL" = "0" ]

      - name: Upload Switch artifact
        uses: actions/upload-artifact@v4
        with:
          name: waystone-switch
          path: switch/waystone.nro
          if-no-files-found: error

  build-android:
    needs: version
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3's default "tools platform-tools" fails: Google no longer serves the legacy `tools` package.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform, build-tools, NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WAYSTONE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "keystore decoded ($(wc -c < "$RUNNER_TEMP/release.jks") bytes)"

      - name: Build signed release APK
        shell: bash
        working-directory: android
        env:
          WAYSTONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAYSTONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAYSTONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :engine:cargoNdkBuild :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist-android/waystone.apk"

      - name: Verify APK signature, version and native libs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose --print-certs dist-android/waystone.apk
          "$BT/aapt2" dump badging dist-android/waystone.apk > "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='${{ needs.version.outputs.version }}'" "$RUNNER_TEMP/badging.txt"
          unzip -l dist-android/waystone.apk | grep -E 'lib/(arm64-v8a|x86_64)/lib(waystone_mobile|jnidispatch)\.so'

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: waystone-android
          path: dist-android/waystone.apk
          if-no-files-found: error

  build-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: "", run_check: true }
          - { os: macos-14, target: x86_64-apple-darwin, ext: "", run_check: false }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "", run_check: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", run_check: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Secret Service build deps (keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Build desktop
        shell: bash
        run: cargo build --release --locked -p waystone-desktop --target ${{ matrix.target }}

      - name: Stage asset (+ version check)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-desktop
          DST="dist-desktop/waystone-desktop-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/waystone-desktop${{ matrix.ext }}" "$DST"
          if [ "${{ matrix.run_check }}" = "true" ]; then
            OUT=$("$DST" --version); echo "$OUT"
            echo "$OUT" | grep -F "${{ needs.version.outputs.version }}"
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: waystone-desktop-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error

  publish:
    needs: [build-3ds, build-switch, build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List release assets
        run: ls -lR dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/waystone-3ds/waystone-3ds-spike.3dsx
            dist/waystone-3ds/waystone-3ds-spike.cia
            dist/waystone-switch/waystone.nro
            dist/waystone-android/waystone.apk
            dist/waystone-desktop-*/waystone-desktop-*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
